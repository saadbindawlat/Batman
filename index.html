<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman Team Presentation Tour</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="js/game.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <h1>Batman Team Presentation Tour</h1>
        <p>
          Travel across Gotham-style checkpoints, meet each teammate, and update
          the presentation by editing <code>data/dialogue.json</code>.
        </p>
      </header>
      <section class="game-frame">
        <div id="game-container" aria-label="Batman presentation game"></div>
      </section>
    </main>
  </body>
</html>
